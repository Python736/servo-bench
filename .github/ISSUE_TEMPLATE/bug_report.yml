name: 🐛 Bug report
description: Something doesn't work or looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Servo Bench better! A screenshot helps a lot.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I dropped a servo on the elbow arm and it jumped to the mat…
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Your build (optional)
      description: In the app, open "Save or share a build", click "Copy build as text" and paste it here.
      render: json
  - type: input
    id: browser
    attributes:
      label: Browser and computer
      placeholder: Chrome 140 on Windows 11 laptop
  - type: dropdown
    id: hardware
    attributes:
      label: Is it about the Arduino code on real hardware?
      options:
        - "No, it's in the app"
        - "Yes, Arduino Uno / Nano / Mega"
        - "Yes, ESP32"
