<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1714"/>
      <stop offset="1" stop-color="#1b2a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#e0661c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e0661c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="caseBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7fe0"/>
      <stop offset="1" stop-color="#244f9e"/>
    </linearGradient>
    <linearGradient id="caseDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d42"/>
      <stop offset="1" stop-color="#1c1e21"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ced3"/>
      <stop offset="1" stop-color="#8d949b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- text -->
  <g transform="translate(80 0)">
    <rect x="0" y="92" width="58" height="58" rx="14" fill="#e0661c"/>
    <g transform="translate(11 103)" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="13" width="24" height="18" rx="3"/>
      <circle cx="10" cy="13" r="5"/>
      <path d="M10 13l22-10"/>
      <circle cx="34" cy="2" r="2.2"/>
    </g>
    <text x="78" y="138" font-size="54" font-weight="800" fill="#f2f5f3" letter-spacing="1">SERVO BENCH</text>
    <text x="0" y="205" font-size="28" font-weight="600" fill="#f2f5f3">Build servo robots in 3D before you buy a single part.</text>
    <text x="0" y="245" font-size="20" fill="#9fb0a8">Real-size SG90, MG90S and MG996R servos. Snap, pose, animate,</text>
    <text x="0" y="273" font-size="20" fill="#9fb0a8">then export ready-to-upload Arduino code. Free, in your browser.</text>
    <g font-size="15" font-weight="600">
      <rect x="0" y="306" width="148" height="34" rx="17" fill="#e0661c"/>
      <text x="74" y="328" text-anchor="middle" fill="#fff">Real dimensions</text>
      <rect x="160" y="306" width="140" height="34" rx="17" fill="none" stroke="#3d5249"/>
      <text x="230" y="328" text-anchor="middle" fill="#cfdad5">Arduino export</text>
      <rect x="312" y="306" width="128" height="34" rx="17" fill="none" stroke="#3d5249"/>
      <text x="376" y="328" text-anchor="middle" fill="#cfdad5">Photo render</text>
      <rect x="452" y="306" width="110" height="34" rx="17" fill="none" stroke="#3d5249"/>
      <text x="507" y="328" text-anchor="middle" fill="#cfdad5">No install</text>
    </g>
  </g>

  <!-- illustration: a servo carrying a second servo on its arm -->
  <g transform="translate(880 92) scale(0.76)" filter="url(#shadow)">
    <!-- motion arc -->
    <path d="M60 -10 A230 230 0 0 1 300 120" fill="none" stroke="#e0661c" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.9"/>
    <path d="M292 104l10 18 4-20" fill="none" stroke="#e0661c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- base servo -->
    <g transform="translate(20 150)">
      <path d="M18 168 C -10 175, -30 196, -48 210" fill="none" stroke="#7a4a2a" stroke-width="5"/>
      <path d="M26 170 C 0 180, -22 200, -42 216" fill="none" stroke="#c23b2b" stroke-width="5"/>
      <path d="M34 172 C 10 186, -14 206, -36 222" fill="none" stroke="#f0a020" stroke-width="5"/>
      <rect x="-70" y="206" width="36" height="22" rx="3" fill="#15171a" transform="rotate(-38 -52 217)"/>
      <rect x="0" y="40" width="170" height="135" rx="10" fill="url(#caseBlue)"/>
      <rect x="-32" y="72" width="234" height="16" rx="4" fill="#2a5bb8"/>
      <circle cx="-18" cy="80" r="4.5" fill="#173a7d"/>
      <circle cx="188" cy="80" r="4.5" fill="#173a7d"/>
      <rect x="24" y="108" width="122" height="38" rx="4" fill="#eef1f4"/>
      <text x="85" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#244f9e">SG90</text>
      <rect x="20" y="18" width="70" height="26" rx="8" fill="#2a5bb8"/>
      <ellipse cx="55" cy="18" rx="30" ry="9" fill="#4a7fe0"/>
      <!-- horn + link -->
      <g transform="rotate(-28 55 12)">
        <rect x="38" y="2" width="230" height="22" rx="11" fill="url(#link)"/>
        <circle cx="55" cy="13" r="13" fill="#f4f5f6"/>
        <circle cx="55" cy="13" r="4" fill="#9aa1a8"/>
        <g fill="#6c737a"><circle cx="100" cy="13" r="3.5"/><circle cx="140" cy="13" r="3.5"/><circle cx="180" cy="13" r="3.5"/><circle cx="220" cy="13" r="3.5"/><circle cx="252" cy="13" r="3.5"/></g>
      </g>
    </g>

    <!-- second servo riding on the arm end -->
    <g transform="translate(228 -20) rotate(-28 60 80)">
      <rect x="0" y="40" width="122" height="98" rx="8" fill="url(#caseDark)"/>
      <rect x="-22" y="62" width="166" height="12" rx="3" fill="#2a2d31"/>
      <rect x="18" y="86" width="86" height="28" rx="3" fill="#e6e9ec"/>
      <text x="61" y="105" text-anchor="middle" font-size="14" font-weight="800" fill="#26282b">SG90</text>
      <rect x="14" y="22" width="52" height="22" rx="6" fill="#2a2d31"/>
      <ellipse cx="40" cy="22" rx="22" ry="7" fill="#4a4e54"/>
      <g transform="rotate(-50 40 16)">
        <rect x="28" y="8" width="84" height="16" rx="8" fill="#f4f5f6"/>
        <circle cx="40" cy="16" r="9" fill="#ffffff"/>
        <circle cx="40" cy="16" r="3" fill="#9aa1a8"/>
        <circle cx="102" cy="16" r="6" fill="#e0661c"/>
      </g>
    </g>
  </g>
</svg>
